@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

width:640px}.actions,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hero-art{min-height:350px;display:grid;place-items:center}.orbit{width:min(100%,410px);aspect-ratio:1;border:2px dashed var(--ink);border-radius:48% 52% 45% 55%;display:grid;place-items:center;position:relative;transform:rotate(-5deg)}.core{width:55%;aspect-ratio:1;border:var(--border);border-radius:50%;background:var(--yellow);box-shadow:var(--shadow);display:grid;place-items:center;text-align:center;padding:18px;transform:rotate(5deg);font-size:clamp(1.3rem,3vw,2rem);font-weight:800;line-height:1.08}.chip{position:absolute;border:var(--border);border-radius:999px;padding:10px 15px;font-weight:800;box-shadow:3px 3px var(--ink);background:white}.chip.a{top:8%;left:-1%;background:var(--coral);transform:rotate(-7deg)}.chip.b{top:24%;right:-2%;background:var(--blue);color:white;transform:rotate(7deg)}.chip.c{bottom:12%;left:1%;background:var(--yellow)}.chip.d{bottom:7%;right:1%;transform:rotate(-5deg)}.section{padding:30px 0}.headrow{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.headrow p{max-width:550px;margin-bottom:0}.grid{display:grid;gap:17px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.bento{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:16px}.card{background:white;border:var(--border);border-radius:var(--radius);padding:23px;box-shadow:var(--shadow);min-width:0}.blue{background:var(--blue)!important;color:white}.yellow{background:var(--yellow)!important;color:var(--ink)}.coral{background:var(--coral)!important;color:var(--ink)}.card.blue p{color:#f5f7ff}.card h3{margin-bottom:9px}.icon{width:47px;height:47px;display:grid;place-items:center;background:var(--yellow);border:var(--border);border-radius:15px;font-size:1.35rem;margin-bottom:16px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:11px 17px;border:var(--border);border-radius:999px;background:var(--yellow);color:var(--ink);font-weight:800;text-decoration:none;box-shadow:3px 3px var(--ink);transition:transform .15s,box-shadow .15s}.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px var(--ink)}.btn.blue{background:var(--blue);color:white}.btn.coral{background:var(--coral)}.btn.white{background:white;color:var(--ink)}.btn.small{min-height:35px;padding:6px 11px;font-size:.8rem}.btn:disabled{opacity:.5;cursor:not-allowed}.pagehead{padding:15px 0 25px}.pagehead p{max-width:760px}.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:5px 10px;font-size:.78rem;font-weight:800;background:white}.notice{padding:14px 16px;border:2px solid var(--ink);border-radius:16px;background:#fff3bf;margin:14px 0}.notice.blue{background:#e6efff!important;color:var(--ink)!important}.notice.coral{background:#ffe2de!important}.field{min-width:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}label{display:block;font-size:.85rem;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:white;color:var(--ink)}textarea{min-height:95px;resize:vertical}.help,small{font-size:.8rem;color:var(--muted)}.stat{padding:18px;border:var(--border);border-radius:20px;background:white;box-shadow:3px 3px var(--ink)}.num{font-size:2rem;font-weight:800;letter-spacing:-.05em}.progress{height:15px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:white}.fill{height:100%;background:var(--blue);border-right:2px solid var(--ink)}.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.step{border:2px solid var(--ink);border-radius:18px;padding:15px;background:white}.step:nth-child(2){background:var(--yellow)}.step:nth-child(3){background:#ffe2de}.bubbles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.bubble{min-height:175px;padding:20px;border:3px solid var(--ink);border-radius:48% 52% 50% 50%/48% 45% 55% 52%;background:white;box-shadow:6px 6px var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .17s,box-shadow .17s;color:var(--ink)}.bubble:nth-child(2n){border-radius:46% 54% 45% 55%/55% 48% 52% 45%}.bubble:nth-child(3n){border-radius:53% 47% 54% 46%/45% 55% 45% 55%}.bubble:hover{transform:translate(-3px,-4px) rotate(-1deg);box-shadow:10px 10px var(--ink)}.bubble strong{font-size:clamp(1.1rem,2.3vw,1.55rem);line-height:1.1}.bubble small{margin-top:8px;color:inherit;opacity:.8}.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.crumbs button{border:0;background:none;text-decoration:underline;font-weight:800;padding:6px}.coursecols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.coursecol{border:var(--border);border-top:10px solid var(--blue);border-radius:22px;padding:17px;background:white;box-shadow:var(--shadow);min-width:0}.coursecol:nth-child(2){border-top-color:var(--coral)}.slot{display:grid;grid-template-columns:30px minmax(0,1fr);gap:9px;align-items:center;border:2px solid var(--ink);border-radius:14px;padding:9px;margin:9px 0;background:#fffdf7}.slot.locked{background:#f1f0ec}.slotnum{width:29px;height:29px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--yellow);font-weight:800}.slotname{font-weight:800;overflow-wrap:anywhere}.slot select,.slot input{grid-column:2;min-height:39px;padding:7px}.coursechoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.choice{border:2px solid var(--ink);border-radius:13px;background:white;padding:11px;text-align:left;font-weight:800;min-height:55px}.choice:hover{background:var(--yellow)}.choice small{display:block;margin-top:4px;font-weight:500}.audit{border-left:6px solid var(--blue);background:#edf4ff;border-radius:0 12px 12px 0;padding:10px;margin:9px 0}.audit.warn{border-color:var(--coral);background:#fff0ed}.calcrow{display:grid;grid-template-columns:1.2fr .7fr .7fr auto;gap:9px;align-items:end;margin-bottom:10px}.toprow{grid-template-columns:1.2fr .8fr auto}.result{border:var(--border);border-radius:20px;padding:18px;background:var(--yellow);margin-top:15px}.big{font-size:2.3rem;font-weight:800;letter-spacing:-.05em}.tip{font-size:.83rem;color:var(--muted)}.listitem{border:2px solid var(--ink);border-radius:14px;padding:12px;background:white;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:9px 0}.listitem p{margin:5px 0 0}.empty{padding:22px;border:2px dashed #999;border-radius:16px;text-align:center;color:var(--muted)}.stack{display:flex;flex-direction:column;gap:10px}.checkline{display:flex;gap:10px;align-items:center}.checkline input{width:20px;height:20px;min-height:20px}.resource{display:flex;justify-content:space-between;padding:13px;border:2px solid var(--ink);border-radius:13px;background:white;text-decoration:none;font-weight:800}.resource:hover{background:var(--yellow)}.hidden{display:none!important}.divider{border:0;border-top:2px dashed #ccc;margin:18px 0}
@media(max-width:900px){.navlinks{display:none;position:absolute;top:70px;left:0;right:0;background:var(--cream);padding:12px 18px;border-bottom:2px solid var(--ink);flex-direction:column}.navlinks.open{display:flex}.menu{display:inline-flex;margin-left:auto}.hero{grid-template-columns:1fr;padding-top:25px}.hero-art{min-height:300px;max-width:500px;margin:auto;width:100%}.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.bento .card:first-child{grid-column:span 2}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}

<main id="app"></main><footer><div class="foot"><div class="brand"><span class="mark">C✦</span><span>coursemaxxing</span></div><small>Student-friendly planning · Ontario-focused · Verify official course and admissions requirements.</small></div></footer>
<script>
'use strict';
const KEY='coursemaxxing_master_v1';const blank=()=>({name:'',grade:11,targets:{average:90,career:''},top6:Array.from({length:6},()=>({name:'',grade:''})),marks:[],planner:{},deadlines:[],programs:[],experiences:[],interests:{area:'',career:'',dealbreaker:'Co-op',distance:'Any distance',budget:'Any budget',step:1},tipsDone:{},credits:{earned:0,volunteer:0,online:0,osslt:false,financial:false}});let state=load();let pendingSlot='';
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(state));navActive()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function page(){return (location.hash.replace(/^#\/?/,'').split('?')[0]||'home').toLowerCase()}function go(r){location.hash='#/'+(r==='home'?'':r)}function navActive(){document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===page()))}window.addEventListener('hashchange',render);document.getElementById('menuToggle').onclick=()=>{let n=document.getElementById('navlinks');n.classList.toggle('open');document.getElementById('menuToggle').setAttribute('aria-expanded',n.classList.contains('open'))};
const head=(k,t,d,extra='')=>`<section class="pagehead"><div class="eyebrow"><span class="dot"></span>${k}</div><h1 style="font-size:clamp(2.2rem,5vw,3.5rem)">${t}</h1><p>${d}</p>${extra?`<div class="row">${extra}</div>`:''}</section>`;
function home(){return `<section class="hero"><div><div class="eyebrow"><span class="dot"></span>COURSEMAXXING ✦ FOR STUDENTS</div><h1>School doesn't come with an instruction manual. <span style="color:var(--blue)">So we made one.</span></h1><p>Courses. University. Grades. What's next. Coursemaxxing puts the important stuff in one place so you can actually figure it out.</p><div class="actions"><a class="btn blue" href="#/profile">Get Started →</a><a class="btn white" href="#/tools">Explore the tools</a></div></div><div class="hero-art"><div class="orbit"><div class="core">Your future.<br>Less guesswork.</div><span class="chip a">Plan it ✦</span><span class="chip b">Grade goals</span><span class="chip c">Find your path</span><span class="chip d">You've got this</span></div></div></section><section class="section"><div class="headrow"><div><div class="eyebrow">YOUR TOOLKIT</div><h2>Big questions. One place.</h2></div><p>Start wherever you are. Build a plan as you learn what matters to you.</p></div><div class="bento"><article class="card blue"><div class="icon">％</div><h3>Calculators</h3><p>Check course marks, try different scenarios and see how your Top 6 could shape up.</p><a class="btn white" href="#/tools">Calculate →</a></article><article class="card yellow"><div class="icon">▦</div><h3>Course Planner</h3><p>Organize courses, see basic planning alerts and think ahead.</p><a class="btn white" href="#/courses">Plan courses →</a></article><article class="card coral"><div class="icon">✦</div><h3>Scout Ingeniosus</h3><p>Explore interests and start researching Ontario university pathways.</p><a class="btn white" href="#/explore">Explore →</a></article><article class="card"><div class="icon">✎</div><h3>Your Portfolio</h3><p>Keep experiences, saved programs and deadlines together.</p><a class="btn white" href="#/portfolio">Open portfolio →</a></article></div></section><section class="section"><article class="card"><div class="eyebrow">WHY WE'RE BUILDING THIS</div><h2>Guidance shouldn't depend on who you know.</h2><p>Coursemaxxing started from my own experience as a high school student. I've been fortunate to have an older sibling who could help me navigate the questions that come with high school — what courses to take, how to prepare for university, what opportunities matter, and what I should actually be doing to build my future. But not every student has someone they can ask all of those questions to. I wanted to build the resource I wish every student had: one place to figure things out and make smarter decisions.</p></article></section>`}
function avg6(){let a=state.top6.map(x=>x.grade).filter(v=>v!==''&&Number.isFinite(+v)&&+v>=0&&+v<=100).map(Number);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}function days(date){let d=new Date(date+'T00:00:00');let n=Math.ceil((d-new Date(new Date().toDateString()))/86400000);return n<0?`${-n} day(s) overdue`:n===0?'Today':`In ${n} day(s)`}
function dashboard(){let g=+state.grade||11,starter=g<=9,earned=clamp(+state.credits.earned||0,0,30),vol=clamp(+state.credits.volunteer||0,0,40),a=avg6(),dead=state.deadlines.filter(x=>x.date).sort((x,y)=>x.date.localeCompare(y.date)).slice(0,3);return `${head(starter?'HIGH SCHOOL STARTER KIT':'UNIVERSITY COMMAND CENTER',`Hey${state.name?', '+esc(state.name):''}. Let's make a plan.`,starter?'Build your high school foundations one step at a time. You do not need your whole future figured out.':'Keep your marks, prerequisites and deadlines in view. Focus on the next useful step.',`<a class="btn blue" href="#/courses">Plan courses →</a><a class="btn white" href="#/tools">Open calculators</a>`)}${starter?`<div class="grid g2"><article class="card blue"><div class="row" style="justify-content:space-between"><h3>OSSD credit progress</h3><span class="pill">30 credits</span></div><div class="progress"><div class="fill" style="width:${earned/30*100}%"></div></div><p style="color:white;margin-top:10px"><b>${earned}/30 credits</b> earned</p><label for="earned" style="color:white">Credits earned so far</label><input id="earned" type="number" min="0" max="30" value="${earned}"><p style="color:white;font-size:.8rem">For students entering Grade 9 in 2024–25 or later: 17 compulsory and 13 optional credits, plus other graduation requirements. Confirm your own record with guidance.</p></article><article class="card yellow"><h3>Volunteer hours tracker</h3><div class="progress"><div class="fill" style="width:${vol/40*100}%;background:var(--coral)"></div></div><p><b>${vol}/40 hours</b> recorded</p><label for="vol" >Hours completed</label><input id="vol" type="number" min="0" max="40" value="${vol}"><p class="help">Ontario students generally need 40 community-involvement hours to graduate.</p></article></div><div class="grid g2 section"><article class="card"><h3>High school, explained</h3><p>Ontario Grade 9 math is destreamed. Course pathways and prerequisites vary by subject. Check your school's course calendar before choosing future courses.</p><a class="btn white" target="_blank" rel="noopener" href="https://www.ontario.ca/page/earning-your-high-school-diploma">Official graduation rules ↗</a></article><article class="card coral"><h3>Build good habits early</h3><p>Track credits, try subjects, ask questions early and record activities and achievements. You can change your mind as you learn more.</p><a class="btn white" href="#/studytips">Study tips →</a></article></div>`:`<div class="grid g3"><div class="stat"><small>Current Top 6</small><div class="num">${a===null?'—':a.toFixed(1)+'%'}</div><small>Based on entered marks</small></div><div class="stat"><small>Target average</small><div class="num">${+state.targets.average||90}%</div><small>Your personal goal</small></div><div class="stat"><small>Saved programs</small><div class="num">${state.programs.length}</div><small>In your portfolio</small></div></div><section class="section"><div class="headrow"><div><div class="eyebrow">ADMISSIONS TIMELINE</div><h2>How marks change over time</h2></div><p>Timing varies by university and program. Check official admissions pages.</p></div><div class="timeline"><div class="step"><span class="pill">Grade 11</span><h3 style="margin-top:12px">Early picture</h3><p>Grade 11 marks can help universities assess you before all Grade 12 marks are available.</p></div><div class="step"><span class="pill">Grade 12 · Fall</span><h3 style="margin-top:12px">Applications</h3><p>Apply and keep prerequisites and deadlines organized.</p></div><div class="step"><span class="pill">Grade 12 · Spring</span><h3 style="margin-top:12px">Updated marks</h3><p>Semester 2 midterms may replace earlier estimates. Exact review timing varies.</p></div></div></section><div class="grid g2"><article class="card"><h3>Quick actions</h3><div class="stack"><a class="btn blue" href="#/tools">Top 6 Calculator →</a><a class="btn white" href="#/courses">Prerequisite Auditor →</a><a class="btn coral" href="#/explore">Scout Ingeniosus →</a></div></article><article class="card"><div class="row" style="justify-content:space-between"><h3>Deadline board</h3><a href="#/portfolio" class="btn small white">Manage</a></div>${dead.length?dead.map(d=>`<div class="listitem"><div><b>${esc(d.name)}</b><p>${esc(d.date)}</p></div><span class="pill">${days(d.date)}</span></div>`).join(''):'<div class="empty">No deadlines yet. Add dates in your Portfolio.</div>'}</article></div>`}`}
function tools(){return `${head('THE TOOLKIT','Make the numbers make sense.','Enter your own course and assignment names, weights and marks. Everything is blank until you fill it in.') }<section class="section"><div class="grid g2"><article class="card yellow"><div class="eyebrow">TOOL 01</div><h2>Course Grade Calculator</h2><p>Your teacher doesn't grade everything equally. A 50% on a major project affects your average more than a 50% on a pop quiz. Add each component and its weight to calculate your weighted grade.</p><div class="notice">Use the weighting from your course outline. For a final grade, component weights should total 100%.</div></article><article class="card"><div class="row" style="justify-content:space-between"><h3>Your components</h3><button class="btn small coral" id="addRow">+ Add row</button></div><div id="gradeRows"></div><div class="row"><button class="btn white" id="clearRows">Clear</button><button class="btn blue" id="calcGrade">Calculate grade</button></div><div id="gradeResult"></div></article></div></section><section class="section"><div class="grid g2"><article class="card blue"><div class="eyebrow">TOOL 02</div><h2>Top 6 Calculator</h2><p style="color:white">Ontario university programs often calculate an admission average using six Grade 12 U/M courses, including prerequisites. Exact rules vary by program and institution.</p><div class="notice">Play the “what-if” game: enter current marks and estimates for unfinished courses.</div></article><article class="card"><h3>Top 6 courses</h3><div id="topRows"></div><div class="field"><label for="target">Target program average (%)</label><input id="target" type="number" min="0" max="100" value="${esc(state.targets.average??90)}"></div><div class="result"><small>Entered average</small><div class="big" id="avgResult">${avg6()===null?'—':avg6().toFixed(1)+'%'}</div><div id="avgMessage" class="tip"></div></div><button class="btn blue" id="saveTop" style="margin-top:12px">Save marks</button></article></div></section>`}
function gradeRows(){let rows=state.marks.length?state.marks:[{name:'',weight:'',grade:''}];return rows.map((x,i)=>`<div class="calcrow"><div class="field"><label>Component name</label><input data-n="${i}" placeholder="e.g. Final exam" value="${esc(x.name)}"></div><div class="field"><label>Weight (%)</label><input data-w="${i}" type="number" min="0" max="100" placeholder="30" value="${esc(x.weight)}"></div><div class="field"><label>Grade (%)</label><input data-g="${i}" type="number" min="0" max="100" placeholder="85" value="${esc(x.grade)}"></div><button class="btn small white remove" data-rm="${i}">Remove</button></div>`).join('')}

function auditor(){let root=document.getElementById('audit');if(!root)return;let all=Object.entries(state.planner).flatMap(([g,a])=>a.map(x=>({...x,g:+g}))).filter(x=>x.code),m=[];if(+state.grade>=11&&!all.some(x=>x.code==='ENG4U'))m.push(['warn','ENG4U is not in your current plan. Check whether your target program requires Grade 12 English.']);if(+state.grade===11&&all.some(x=>x.g===12))m.push(['','Grade 12 courses may support early admission review if you meet the program’s requirements.']);if(state.programs.length)m.push(['',`You have ${state.programs.length} saved program(s). Check each program’s official prerequisites.`]);if(!m.length)m.push(['','No obvious planning alerts. This is not a complete prerequisite check.']);root.innerHTML=m.map(x=>`<div class="audit ${x[0]}">${esc(x[1])}</div>`).join('')}

function scout(step){let s=state.interests;if(step===1){let a=[['Business','blue','Finance, management, accounting and marketing'],['Science','yellow','Life sciences, physical sciences and health'],['Arts','coral','Humanities, social sciences and creative fields'],['Other','white','Technology, trades and interdisciplinary paths'],['Not Sure','yellow','Explore before choosing a direction']];return `<h2>What are you curious about?</h2><p>Choose the closest fit. You can change it later.</p><div class="bubbles">${a.map(x=>`<button class="bubble ${x[1]}" data-area="${x[0]}"><strong>${x[0]}</strong><small>${x[2]}</small></button>`).join('')}</div>`}if(step===2)return `<h2>What matters most to you?</h2><p>Pick your priorities and name a career or subject if you have one in mind.</p><div class="card"><div class="fields"><div class="field"><label for="career">Career or subject goal</label><input id="career" value="${esc(s.career)}" placeholder="e.g. finance, psychology, biology"></div><div class="field"><label for="deal">Biggest priority</label><select id="deal">${['Co-op','Cost','Distance','Admissions requirements','Campus life','Not sure'].map(x=>`<option ${s.dealbreaker===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="distance">Preferred distance</label><select id="distance">${['Any distance','Close to home','Within Ontario','Willing to move'].map(x=>`<option ${s.distance===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="budget">Budget preference</label><select id="budget">${['Any budget','Lower cost','Need scholarships','Compare costs'].map(x=>`<option ${s.budget===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="row" style="margin-top:15px"><button class="btn white" data-step="1">← Back</button><button class="btn blue" id="generate">Build my starter shortlist →</button></div></div>`;let opts=options(s.area,s.career);return `<h2>Your starter shortlist</h2><p>Based on <span class="pill">${esc(s.area||'Not Sure')}</span> and your priorities. These are starting points, not ranked matches.</p><div class="grid g2">${opts.map((o,i)=>`<article class="card ${i%3===0?'blue':i%3===1?'yellow':'coral'}"><div class="eyebrow">STARTER OPTION ${i+1}</div><h3>${o.name}</h3><p>${o.why}</p><p><b>Research next:</b> admission prerequisites, co-op, costs, distance and scholarships on the official site.</p><div class="row"><a class="btn white" target="_blank" rel="noopener" href="${o.url}">Official website ↗</a><button class="btn white" data-save-program="${o.name}">Save to Portfolio</button></div></article>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn white" data-step="2">← Change priorities</button><button class="btn coral" data-step="1">Start over</button><a class="btn blue" href="#/portfolio">View portfolio →</a></div>`}
function options(area,career){let c=(career||'').toLowerCase();if(area==='Business'||/finance|account|business|econom|marketing/.test(c))return [{name:'University of Toronto',why:'Research Rotman Commerce and related undergraduate options; verify the route and requirements.',url:'https://www.utoronto.ca/'},{name:'Western University',why:'Research Ivey AEO and other business/economics pathways.',url:'https://www.uwo.ca/'},{name:'Wilfrid Laurier University',why:'Research business and economics programs and co-op options.',url:'https://www.wlu.ca/'}];if(area==='Science'||/biology|chem|physics|health|science/.test(c))return [{name:'University of Waterloo',why:'Research science programs, prerequisites and co-op availability.',url:'https://uwaterloo.ca/'},{name:'McMaster University',why:'Research life science and other science pathways.',url:'https://www.mcmaster.ca/'},{name:'University of Toronto',why:'Compare science programs and campus options.',url:'https://www.utoronto.ca/'}];if(area==='Arts'||/psych|law|history|english|sociology|politic/.test(c))return [{name:'York University',why:'Research humanities, social science and psychology options.',url:'https://www.yorku.ca/'},{name:'University of Toronto',why:'Explore humanities and social science programs.',url:'https://www.utoronto.ca/'},{name:'Queen’s University',why:'Research arts and social science programs.',url:'https://www.queensu.ca/'}];return [{name:'Ontario Universities’ Info',why:'Compare university programs across Ontario.',url:'https://www.ontariouniversitiesinfo.ca/'},{name:'Ontario Colleges',why:'Compare college certificates, diplomas and degrees.',url:'https://www.ontariocolleges.ca/'},{name:'OUAC',why:'Learn how Ontario university applications work.',url:'https://www.ouac.on.ca/'}]}

const saveTargets=document.getElementById('saveTargets');if(saveTargets)saveTargets.onclick=()=>{state.targets.career=document.getElementById('targetCareer').value;state.targets.average=clamp(+document.getElementById('targetAvg').value||0,0,100);save();flash(saveTargets,'Saved ✓')};document.querySelectorAll('[data-rprog]').forEach(x=>x.onclick=()=>{state.programs.splice(+x.dataset.rprog,1);save();render()});const addD=document.getElementById('addDeadline');if(addD)addD.onclick=()=>{let n=document.getElementById('dname').value.trim(),d=document.getElementById('ddate').value;if(!n||!d){alert('Enter a deadline name and date.');return}state.deadlines.push({name:n,date:d});save();render()};document.querySelectorAll('[data-rdead]').forEach(x=>x.onclick=()=>{state.deadlines.splice(+x.dataset.rdead,1);save();render()});const addE=document.getElementById('addExp');if(addE)addE.onclick=()=>{let n=document.getElementById('expname').value.trim();if(!n){alert('Enter an experience name.');return}state.experiences.push({name:n,type:document.getElementById('exptype').value,notes:document.getElementById('expnotes').value.trim()});save();render()};document.querySelectorAll('[data-rexp]').forEach(x=>x.onclick=()=>{state.experiences.splice(+x.dataset.rexp,1);save();render()});document.querySelectorAll('[data-tip]').forEach(x=>x.onchange=()=>{state.tipsDone[x.dataset.tip]=x.checked;save()});const sp=document.getElementById('saveProfile');if(sp)sp.onclick=()=>{state.name=document.getElementById('pname').value.trim();state.grade=+document.getElementById('pgrade').value;save();render();alert('Profile saved.')};const ex=document.getElementById('exportData');if(ex)ex.onclick=()=>{let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='coursemaxxing-data.json';a.click();URL.revokeObjectURL(a.href)};const reset=document.getElementById('resetData');if(reset)reset.onclick=()=>{if(confirm('Delete all Coursemaxxing data saved in this browser?')){localStorage.removeItem(KEY);state=blank();location.hash='#/';render()}}}
function readGrade(){state.marks=[...document.querySelectorAll('[data-n]')].map((x,i)=>({name:x.value,weight:document.querySelector(`[data-w="${i}"]`).value,grade:document.querySelector(`[data-g="${i}"]`).value}));save()}function calcGrade(){readGrade();let rows=state.marks.filter(x=>x.weight!==''&&x.grade!==''&&+x.weight>=0&&+x.grade>=0&&+x.grade<=100),w=rows.reduce((a,x)=>a+(+x.weight),0),points=rows.reduce((a,x)=>a+(+x.weight)*(+x.grade),0),out=document.getElementById('gradeResult');if(!rows.length||w<=0){out.innerHTML='<div class="notice coral">Enter at least one component with a positive total weight and a valid grade.</div>';return}let avg=points/w,remaining=100-w;out.innerHTML=`<div class="result"><small>Weighted average of entered components</small><div class="big">${avg.toFixed(2)}%</div><p>${w.toFixed(1)}% of course weight entered. ${remaining>0?remaining.toFixed(1)+'% not represented yet.':w>100?'Weights exceed 100%; check your inputs.':'Weights total 100%.'}</p>${remaining>0&&w<100?'<label for="targetFinal">Desired final grade (%)</label><input id="targetFinal" type="number" min="0" max="100" placeholder="e.g. 85"><button class="btn blue" id="required" style="margin-top:8px">What do I need?</button><p id="requiredOut"></p>':''}</div>`;let btn=document.getElementById('required');if(btn)btn.onclick=()=>{let t=+document.getElementById('targetFinal').value,need=(t*100-points)/remaining,o=document.getElementById('requiredOut');o.textContent=!Number.isFinite(t)||t<0||t>100?'Enter a target from 0 to 100.':need>100?`You would need ${need.toFixed(1)}% on the remaining work, above 100%.`:`You need about ${need.toFixed(1)}% average on the remaining ${remaining.toFixed(1)}% of the course.`}}
function updateAvg(){let a=avg6(),o=document.getElementById('avgResult'),m=document.getElementById('avgMessage'),t=+(document.getElementById('target')?.value??state.targets.average??90);if(o)o.textContent=a===null?'—':a.toFixed(1)+'%';if(m)m.textContent=a===null?'Enter marks for courses you want to include.':a>=t?`At or above your ${t}% target based on entered marks.`:`${(t-a).toFixed(1)} percentage points below your ${t}% target based on entered marks.`}function flash(el,t){let b=typeof el==='string'?document.getElementById(el):el,old=b.textContent;b.textContent=t;setTimeout(()=>{if(b.isConnected)b.textContent=old},1300)}
render();
</script></body></html>
