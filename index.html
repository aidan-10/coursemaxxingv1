<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coursemaxxing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

:root {
  /* Coursemaxxing Master Brief Palette */
  --cm-cream: #FDFBF7;
  --cm-blue: #3B82F6;
  --cm-yellow: #FFD84D;
  --cm-coral: #FF6B5E;
  --cm-black: #111111;
  --cm-white: #FFFFFF;
  --cm-grey: #f3f4f6;
  --mute: #555555;
  --line: #e4e8e6;
  
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { 
  margin: 0; 
  background: var(--cm-cream); 
  color: var(--cm-black); 
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; 
  overflow-x: hidden; 
}

h1, h2, h3 { line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.02em; }
h1 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 900; }
h2 { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 900; }
h3 { font-size: 1.3rem; font-weight: 900; }
p { margin: 0 0 1em; color: var(--mute); line-height: 1.6; font-weight: 500; }
a { color: inherit; text-decoration: none; }

/* ===== NAVIGATION ===== */
nav { position: sticky; top: 0; z-index: 50; background: var(--cm-cream); border-bottom: 3px solid var(--cm-black); }
.nb { max-width: 1100px; margin: auto; padding: 12px 20px; display: flex; align-items: center; gap: 20px; }
.logo { font-weight: 900; letter-spacing: .04em; font-size: 1.1rem; color: var(--cm-black); white-space: nowrap; }
.logo b { display: inline-block; margin-left: 4px; padding: 2px 8px; background: var(--cm-blue); border: 2px solid var(--cm-black); border-radius: 8px; transform: rotate(-2deg); color: #fff; }

.links { display: flex; gap: 6px; flex: 1; align-items: center; justify-content: center; }
.links > a { padding: 8px 14px; border: 2px solid transparent; border-radius: 12px; color: var(--cm-black); font-weight: 800; font-size: .95rem; transition: .15s; }
.links > a:hover { background: var(--cm-yellow); border-color: var(--cm-black); }
.links > a.on { background: var(--cm-blue); color: #fff; border-color: var(--cm-black); box-shadow: 3px 3px 0 var(--cm-black); }

.acct { display: flex; gap: 10px; align-items: center; }
.acct-m { display: none; }

.burger { display: none; width: 44px; height: 44px; margin-left: auto; place-items: center; background: var(--cm-yellow); border: 2px solid var(--cm-black); border-radius: 12px; box-shadow: 3px 3px 0 var(--cm-black); color: var(--cm-black); font-size: 1.2rem; font-weight: 900; cursor: pointer; }
.burger:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--cm-black); }

/* Standard Buttons */
.btn-v2 { display: inline-flex; align-items: center; justify-content: center; padding: 15px 24px; border: 3px solid var(--cm-black); border-radius: 16px; font-weight: 900; font-size: 1.05rem; text-decoration: none; color: var(--cm-black); transition: .15s ease; box-shadow: 5px 5px 0 var(--cm-black); cursor: pointer; background:var(--cm-white); }
.btn-v2:hover { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--cm-black); }
.btn-v2.sm { padding: 8px 16px; font-size: .95rem; border-radius: 12px; box-shadow: 3px 3px 0 var(--cm-black); border: 2px solid var(--cm-black); }
.btn-v2.sm:hover { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--cm-black); }
.btn-v2.blue { background: var(--cm-blue); color: #fff; }
.btn-v2.yellow { background: var(--cm-yellow); color: var(--cm-black); }
.btn-v2.coral { background: var(--cm-coral); color: #fff; }

main { max-width: 1100px; margin: auto; padding: 40px 20px 80px; animation: in .3s ease; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

/* Cards & Layout */
.card { background: var(--cm-white); border: 3px solid var(--cm-black); border-radius: 20px; padding: 26px; box-shadow: 6px 6px 0 var(--cm-black); transition: .2s; }
a.card:hover, .card.h:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--cm-black); border-color: var(--cm-blue); }
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.two { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
.six { display: grid; gap: 15px; grid-template-columns: 1fr 1fr; }
@media(max-width: 700px) { .two, .six { grid-template-columns: 1fr; } }

.tag { display: inline-block; font-size: .8rem; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; padding: 6px 12px; border-radius: 99px; background: var(--cm-grey); color: var(--cm-black); border: 2px solid var(--cm-black); margin-bottom: 15px; }
.tag.g { background: var(--cm-yellow); }
.empty { border: 3px dashed var(--cm-black); border-radius: 18px; padding: 26px; text-align: center; color: var(--mute); font-weight: 700; background: var(--cm-white); }
.stat { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 2px solid var(--cm-grey); font-weight: 700; }
.stat:last-child { border: 0; }
.stat span:last-child { color: var(--mute); }

/* Forms & Inputs */
label { display: block; font-weight: 800; font-size: 1rem; margin: 0 0 8px; }
input, select { width: 100%; padding: 14px 16px; border: 3px solid var(--cm-black); border-radius: 12px; background: var(--cm-white); color: var(--cm-black); font-family: inherit; font-weight: 700; font-size: 1rem; }
input:focus, select:focus { outline: none; border-color: var(--cm-blue); box-shadow: 4px 4px 0 var(--cm-blue); }
.form { max-width: 450px; margin: 30px auto; }
.fld { margin-bottom: 20px; }
.res { text-align: center; padding: 30px 10px; display: flex; flex-direction: column; justify-content: center; }
.res .big { font-size: clamp(3rem, 8vw, 4.5rem); font-weight: 900; letter-spacing: -.03em; line-height: 1.1; color: var(--cm-blue); margin: 10px 0; }

/* ===== HOMEPAGE ===== */
.hero-v2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; padding: 40px 0 60px; }
.hero-copy h1 { margin: 0; font-size: clamp(36px, 5vw, 64px); line-height: 1.05; font-weight: 900; }
.hero-copy h1 span { color: var(--cm-blue); }
.hero-copy p { font-size: 1.15rem; font-weight: 600; margin: 25px 0 30px; max-width: 500px; color: var(--cm-black); }
.hero-actions { display: flex; gap: 15px; flex-wrap: wrap; }

.hero-visual { display: flex; flex-direction: column; gap: 15px; }
.visual-card { border: 3px solid var(--cm-black); border-radius: 20px; padding: 25px; box-shadow: 6px 6px 0 var(--cm-black); font-weight: 900; font-size: 1.4rem; transform: rotate(1deg); background: var(--cm-white); }
.vc-1 { background: var(--cm-yellow); transform: rotate(-2deg); }
.vc-2 { background: var(--cm-coral); color: white; transform: rotate(1deg); margin-left: 20px; }
.vc-3 { background: var(--cm-blue); color: white; transform: rotate(-1deg); margin-left: -10px; }

/* ===== EXPLORE BUBBLES ===== */
.explore-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
.bubble { 
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 40px 20px; border: 3px solid var(--cm-black); border-radius: 40px;
  box-shadow: 6px 6px 0 var(--cm-black); font-weight: 900; font-size: 1.4rem; 
  cursor: pointer; transition: .2s; background: var(--cm-white);
}
.bubble:hover { transform: translateY(-4px); box-shadow: 8px 8px 0 var(--cm-black); }
.bubble.blue { background: var(--cm-blue); color: #fff; }
.bubble.yellow { background: var(--cm-yellow); color: var(--cm-black); }
.bubble.coral { background: var(--cm-coral); color: #fff; }

.pathway-panel { display: none; background: var(--cm-white); border: 3px solid var(--cm-black); border-radius: 20px; padding: 30px; margin-top: 30px; box-shadow: 6px 6px 0 var(--cm-black); }
.path-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.path-list a { display: block; padding: 15px; border: 2px solid var(--cm-black); border-radius: 12px; font-weight: 800; background: var(--cm-grey); transition: .15s; }
.path-list a:hover { background: var(--cm-yellow); transform: translateX(5px); }

/* ===== COURSE PLANNER (1x8) ===== */
.planner-wrapper { max-width: 600px; margin: 0 auto; }
.slot { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
.slot-num { width: 45px; height: 45px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--cm-black); color: white; font-weight: 900; font-size: 1.2rem; border-radius: 12px; }

/* Responsive */
@media(max-width: 860px) {
  .burger { display: grid; }
  .acct { display: none; }
  .links { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 10px; padding: 20px; background: var(--cm-cream); border-bottom: 3px solid var(--cm-black); }
  .links.open { display: flex; }
  .acct-m { display: flex; gap: 10px; margin-top: 10px; padding-top: 20px; border-top: 3px solid var(--cm-black); }
  .acct-m .btn-v2 { flex: 1; }
  .hero-v2 { grid-template-columns: 1fr; text-align: left; gap: 30px; }
  .visual-card { margin-left: 0 !important; }
}
</style>
</head>
<body>

<nav>
  <div class="nb">
    <a href="#/" class="logo">COURSE<b>MAXXING</b></a>
    <div class="links" id="links">
      <a href="#/">Home</a>
      <a href="#/explore">Explore</a>
      <a href="#/courses">Courses</a>
      <a href="#/tools">Tools</a>
      <a href="#/top6">Top 6</a>
      <a href="#/architect">Architect</a>
      <a href="#/portfolio">Portfolio</a>
      <div class="acct-m" id="acctm"></div>
    </div>
    <div class="acct" id="acct"></div>
    <button class="burger" onclick="document.getElementById('links').classList.toggle('open')" aria-label="Menu">☰</button>
  </div>
</nav>

<main id="app"></main>

<script>
/* ===== CORE STATE & STORAGE ===== */
let S = { name: '', email: '', grade: 11, in: false, target: '' };
try { const x = localStorage.getItem('cm'); if(x) S = Object.assign(S, JSON.parse(x)) } catch(e){}
const save = () => { try{ localStorage.setItem('cm', JSON.stringify(S)) } catch(e){} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SOON = '<span class="tag">Coming soon</span>';
const empty = t => `<div class="empty">${t}</div>`;
const card = (t, d, h, tag) => `<${h?'a href="'+h+'"':'div'} class="card ${h?'':'h'}"><div style="margin-bottom:10px">${tag||''}</div><h3>${t}</h3><p style="margin:0">${d}</p></${h?'a':'div'}>`;

const GP = {
    8: 'Discover interests, build strong habits, and understand how courses connect to pathways.',
    9: 'Settle into high school, track credits, explore electives and begin identifying interests.',
    10: 'Check prerequisites, graduation requirements and the implications of Grade 11 course choices.',
    11: 'Research post-secondary prerequisites, choose Grade 12 courses strategically and track marks.',
    12: 'Manage applications, prerequisites, deadlines, scholarships and comparisons between offers.'
};

/* ===== AUTHENTICATION ===== */
function auth(su) {
    return `
    <div class="form card">
        <h2>${su ? 'Create your profile' : 'Log in'}</h2>
        ${su ? `<div class="fld"><label>First name / nickname</label><input id="an"></div>` : ''}
        <div class="fld"><label>Email</label><input id="ae" type="email"></div>
        <div class="fld"><label>Password</label><input type="password"></div>
        ${su ? `<div class="fld"><label>Grade</label><select id="ag">${[8,9,10,11,12].map(g=>`<option ${S.grade==g?'selected':''}>${g}</option>`).join('')}</select></div>` : ''}
        <button class="btn-v2 blue" style="width:100%" onclick="doAuth(${su})">${su ? 'Sign up' : 'Log in'}</button>
        <p style="margin:16px 0 0;font-size:.85rem;text-align:center;">(Mock sign-in stored locally for testing)</p>
    </div>`;
}
function doAuth(su) {
    if(su) { S.name = $('an').value; S.grade = +$('ag').value; }
    S.email = $('ae').value;
    S.in = true;
    save(); acct(); go('dashboard');
}
function acct() {
    const h = S.in 
        ? `<a class="btn-v2 sm blue" href="#/dashboard">${esc(S.name || 'Dashboard')}</a>` 
        : `<a class="btn-v2 sm white" href="#/login">Log in</a><a class="btn-v2 sm blue" href="#/signup">Sign up</a>`;
    $('acct').innerHTML = h;
    $('acctm').innerHTML = h;
}

/* ===== LOGIC FUNCTIONS ===== */
function calc() {
    const v = [...document.querySelectorAll('.mk')].map(i => i.value.trim());
    const ok = v.filter(x => x !== '' && !isNaN(x) && x >= 0 && x <= 100);
    const bad = v.some(x => x !== '' && (isNaN(x) || x < 0 || x > 100));
    
    let h;
    if(bad) {
        h = '<h3 style="color:var(--cm-coral)">Invalid Number</h3><p>Marks must be numbers from 0 to 100.</p>';
    } else if (ok.length < 6) {
        h = `<h3>Waiting for grades... (${ok.length}/6)</h3><p>Enter all six marks to see your average.</p>`;
    } else {
        const a = ok.reduce((s, x) => s + +x, 0) / 6;
        const t = parseFloat(S.target);
        h = `<div class="tag blue">YOUR TOP 6</div><div class="big">${a.toFixed(1)}%</div>` +
            (isNaN(t) ? '<p>Target: Not selected</p>' : `<div class="stat"><b>Current</b><span>${a.toFixed(1)}%</span></div><div class="stat"><b>Target</b><span>${t}%</span></div><div class="stat"><b>Difference</b><span style="font-weight:900;color:var(--cm-coral)">${Math.abs(t-a).toFixed(1)} points ${a>=t?'above':'below'}</span></div>`);
    }
    $('res').innerHTML = h;
}

function showPath(category) {
    const p = $('pathway-content');$('pathway-panel').style.display = 'block';
    
    let html = '';
    if (category === 'business') {
        html = `<h3>Business Pathways</h3><p>Select a pathway to see university examples.</p>
        <div class="path-list"><a href="#/universities">Business Administration / BBA →</a><a href="#/universities">Commerce / Finance →</a><a href="#/universities">Accounting →</a></div>`;
    } else if (category === 'science') {
        html = `<h3>Science & Health Pathways</h3><p>Select a pathway to see university examples.</p>
        <div class="path-list"><a href="#/universities">Life Sciences / Pre-Med →</a><a href="#/universities">Computer Science →</a><a href="#/universities">Engineering →</a></div>`;
    } else if (category === 'arts') {
        html = `<h3>Arts & Humanities Pathways</h3><p>Select a pathway to see university examples.</p>
        <div class="path-list"><a href="#/universities">Political Science & Law →</a><a href="#/universities">Psychology →</a><a href="#/universities">English & History →</a></div>`;
    } else {
        html = `<h3>Not sure yet?</h3><p>That's completely normal. A credible career assessment is coming soon.</p>`;
    }
    p.innerHTML = html;
    window.scrollTo({ top: $('pathway-panel').offsetTop - 50, behavior: 'smooth' });
}

/* ===== ROUTES / PAGES ===== */
const R = {
'': () => `
<section class="hero-v2">
  <div class="hero-copy">
    <h1>School doesn't come with an instruction manual.<br><span>So we made one.</span></h1>
    <p>Coursemaxxing puts course planning, grade calculations, and university research in one place so you can actually figure out what to do next.</p>
    <div class="hero-actions">
      <a class="btn-v2 blue" href="#/${S.in ? 'dashboard' : 'signup'}">Get Started →</a>
      <a class="btn-v2 white" href="#/explore">Explore Pathways</a>
    </div>
  </div>
  <div class="hero-visual">
    <div class="visual-card vc-1">1. Explore Universities</div>
    <div class="visual-card vc-2">2. Check Prerequisites</div>
    <div class="visual-card vc-3">3. Build Your 8-Course Plan</div>
  </div>
</section>
`,

dashboard: () => {
    if(!S.in) return auth(0);
    return `
    <h1 style="font-size:2.5rem; margin-bottom:10px;">Welcome, ${esc(S.name || 'Student')}</h1>
    <p style="font-size:1.2rem; margin-bottom:30px;">${GP[S.grade]}</p>
    
    <div class="two" style="margin-bottom:30px">
        <div class="card">
            <h3>Academic snapshot</h3>
            <div class="stat"><b>Grade</b><span>${S.grade}</span></div>
            <div class="stat"><b>Average</b><span>Not added</span></div>
            <div class="stat"><b>Target</b><span>${S.target ? S.target+'%' : 'Not added'}</span></div>
            <div class="stat"><b>University interests</b><span>Not added</span></div>
        </div>
        <div class="card">
            <h3>Profile</h3>
            ${empty('Add your information to personalize your Coursemaxxing experience.')}
            <div style="margin-top:20px"><a class="btn-v2 sm white" href="#/profile">Edit profile</a></div>
        </div>
    </div>
    
    <div class="grid">
        ${card('Explore','Discover guidance.','#/explore')}
        ${card('Tools','Calculators and strategies.','#/tools')}
        ${card('The Architect','Ask for strategic advice.','#/architect')}
        ${card('My Portfolio','Your academic story.','#/portfolio')}
        ${card('Course Planning','Plan your courses.','#/courses')}
    </div>`;
},

explore: () => `
<div style="text-align:center; max-width: 650px; margin: 0 auto 30px;">
    <h1>Explore</h1>
    <p style="font-size:1.15rem;">Select an area below to explore university pathways and see exactly what high school courses you need to get there.</p>
</div>
<div class="explore-grid">
    <div class="bubble blue" onclick="showPath('business')">Business & Commerce</div>
    <div class="bubble coral" onclick="showPath('science')">Science, Tech & Health</div>
    <div class="bubble yellow" onclick="showPath('arts')">Arts, Law & Humanities</div>
    <div class="bubble" onclick="showPath('other')">Not sure yet</div>
</div>
<div id="pathway-panel" class="pathway-panel">
    <div id="pathway-content"></div>
</div>
`,

tools: () => `
<h1 style="text-align:center; margin-bottom:10px;">Tools</h1>
<p style="text-align:center; margin-bottom:40px;">Practical tools and content for students.</p>
<div class="grid">
    ${card('Top 6 Calculator','Works now.','#/top6','<span class="tag g">Live</span>')}
    ${['Studying','School Strategies','University Planning','Course Planning','Academic Improvement'].map(t => card(t,'Content in development.','',S.in?SOON:'<span class="tag">Sign up to view</span>')).join('')}
</div>`,

top6: () => `
<div style="max-width: 900px; margin: 0 auto;">
    <h1 style="text-align:center; margin-bottom:10px;">Top 6 Calculator</h1>
    <p style="text-align:center; margin-bottom:30px;">Enter six marks to calculate your average.</p>
    <div class="two">
        <div class="card">
            <div class="six">
                ${[1,2,3,4,5,6].map(i => `
                <div>
                    <label>Course ${i}</label>
                    <input class="mk" type="number" placeholder="e.g. 90" oninput="calc()">
                </div>`).join('')}
            </div>
            <div class="fld" style="margin-top:20px">
                <label>Target % (optional)</label>
                <input id="tg" type="number" value="${S.target}" oninput="S.target=this.value;save();calc()">
            </div>
        </div>
        <div class="card res" id="res"></div>
    </div>
</div>`,

architect: () => `
<div class="card" style="text-align:center; max-width:600px; margin: 0 auto; padding: 50px 30px;">
    <div class="tag blue">In Development</div>
    <h1 style="margin: 20px 0;">The Architect</h1>
    <p style="font-size: 1.1rem; font-weight: 500;">The Architect is being designed as your personal AI academic advisor. Eventually, it will help you calculate grades, map prerequisites, and plan your high school career based on verified Ontario data.</p>
    <p><strong>Status:</strong> Securing API integrations and verifying database logic.</p>
    <button class="btn-v2 black" style="margin-top:20px;" onclick="go('')">Return Home</button>
</div>`,

universities: () => `
<h1>University Exploration</h1>
<p>Example programs only. Unverified details are marked Coming Soon.</p>
<div class="grid">
    ${['Western / Ivey','Laurier','Other Ontario business options'].map(n => `
    <div class="card">
        <h3>${n}</h3>${['Admission average','Required courses','Prerequisites','Co-op','Approximate cost','Scholarships'].map(f => `<div class="stat"><b>${f}</b>${SOON}</div>`).join('')}
    </div>`).join('')}
</div>`,

courses: () => `
<div class="planner-wrapper">
    <div style="text-align:center; margin-bottom: 30px;">
        <h1>Course Planner</h1>
        <p>Map out your 8 courses for the year. Check with your guidance counsellor to ensure you are hitting all your graduation requirements.</p>
        <select style="max-width:200px; margin:0 auto; text-align:center;">
            <option>Grade 8</option><option>Grade 9</option><option>Grade 10</option>
            <option selected>Grade 11</option><option>Grade 12</option>
        </select>
    </div>
    
    <div class="card">
        <div class="planner-slots">
            ${[1,2,3,4,5,6,7,8].map(i => `
            <div class="slot">
                <div class="slot-num">${i}</div>
                <select>
                    <option value="">Select a course...</option>
                    <option>ENG3U - English</option>
                    <option>MCR3U - Functions</option>
                    <option>SBI3U - Biology</option>
                    <option>SCH3U - Chemistry</option>
                    <option>SPH3U - Physics</option>
                    <option>BAF3M - Accounting</option>
                    <option>HSP3U - Intro to Anthro/Psych/Soc</option>
                    <option>Spare (Grade 12 only)</option>
                </select>
            </div>
            `).join('')}
        </div>
    </div>
    <button class="btn-v2 blue" style="width:100%; margin-top:20px;">Save Course Plan (Coming Soon)</button>
</div>`,

portfolio: () => `
<h1 style="text-align:center; margin-bottom:10px;">My Portfolio</h1>
<p style="text-align:center; margin-bottom:40px;">Your portfolio will appear here once you start building it.</p>
<div class="grid">
    ${[['Academic','Grade, courses, marks, strengths, weaknesses'],['Experience','Extracurriculars, volunteer, work'],['Achievements','Awards, certifications, competitions'],['Future','Goals, university targets, career interests']].map(c => card(c[0], c[1], '', SOON)).join('')}
</div>`,

profile: () => `
<h1 style="text-align:center; margin-bottom:30px;">Profile</h1>
<div class="card" style="max-width:520px; margin: 0 auto;">
    <div class="fld"><label>Name</label><input id="pn" value="${esc(S.name)}"></div>
    <div class="fld"><label>Email</label><input id="pe" value="${esc(S.email)}"></div>
    <div class="fld">
        <label>Grade</label>
        <select id="pg">${[8,9,10,11,12].map(g => `<option ${S.grade==g?'selected':''}>${g}</option>`).join('')}</select>
    </div>
    <div class="fld"><label>Academic information</label>${empty('Not added')}</div>
    <div class="fld"><label>Interests / University targets</label>${empty('Not added')}</div>
    
    <div class="two" style="margin-top:30px;">
        <button class="btn-v2 blue" style="width:100%;" onclick="S.name=$('pn').value;S.email=$('pe').value;S.grade=+$('pg').value;save();acct();go('dashboard')">Save</button>
        <button class="btn-v2 white" style="width:100%;" disabled title="Not connected in V1">Delete account</button>
    </div>
</div>`
};

signup: () => auth(1);
login: () => auth(0);

/* ===== ROUTER ===== */
function go(p) { location.hash = '#/' + p; }
function route() {
    const p = (location.hash.replace('#/', '') || '');
    const f = R[p] || R[''];
    $('app').innerHTML = f();$('links').classList.remove('open');
    document.querySelectorAll('.links>a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#/' + p));
    window.scrollTo(0,0);
    if(p === 'top6') calc();
}

window.addEventListener('hashchange', route);
acct();
route();
</script>
</body>
</html>
