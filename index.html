<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Coursemaxxing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
:root{
  --cm-cream:#FDFBF7;
  --cm-blue:#3B82F6;
  --cm-yellow:#FFD84D;
  --cm-coral:#FF6B5E;
  --cm-black:#111111;
  --cm-white:#FFFFFF;
  
  /* Replaced old green variables with the official brand blue */
  --bg: var(--cm-cream);
  --surf: #ffffff;
  --ink: var(--cm-black);
  --mute: #5d6770;
  --line: #e4e8e6;
  --g: var(--cm-blue);
  --g2: #2563EB;
  --gl: #EFF6FF;
  
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800}h2{font-size:clamp(1.5rem,3vw,2rem)}h3{font-size:1.1rem}
p{margin:0 0 1em;color:var(--mute)}a{color:inherit;text-decoration:none}

/* ===== NAV (V2 style) ===== */
nav{position:sticky;top:0;z-index:50;background:var(--cm-cream,#FDFBF7);border-bottom:2px solid var(--cm-black,#111)}
.nb{max-width:1100px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.logo{font-weight:900;letter-spacing:.04em;font-size:1.05rem;color:var(--cm-black,#111);white-space:nowrap}
.logo b{display:inline-block;margin-left:4px;padding:1px 7px;background:var(--cm-blue,#3B82F6);border:2px solid var(--cm-black,#111);border-radius:8px;transform:rotate(-2deg);color:#fff;}
.links{display:flex;gap:6px;flex:1;align-items:center}
.links>a{padding:7px 13px;border:2px solid transparent;border-radius:12px;color:var(--cm-black,#111);font-weight:800;font-size:.92rem;transition:.15s}
.links>a:hover{background:var(--cm-yellow,#FFD84D);border-color:var(--cm-black,#111)}
.links>a.on{background:var(--cm-blue,#3B82F6);color:#fff;border-color:var(--cm-black,#111);box-shadow:3px 3px 0 var(--cm-black,#111)}
.acct{display:flex;gap:10px;align-items:center}
.acct-m{display:none}
.btn-v2.sm{padding:8px 15px;font-size:.9rem;border-radius:12px;box-shadow:3px 3px 0 var(--cm-black,#111)}
.btn-v2.sm:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--cm-black,#111)}
.btn-v2.white{background:#fff}
.burger{display:none;width:44px;height:44px;margin-left:auto;place-items:center;background:var(--cm-yellow,#FFD84D);border:2px solid var(--cm-black,#111);border-radius:12px;box-shadow:3px 3px 0 var(--cm-black,#111);color:var(--cm-black,#111);font-size:1.2rem;font-weight:900;cursor:pointer}
.burger:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--cm-black,#111)}
@media(max-width:860px){
  .burger{display:grid}
  .acct{display:none}
  .links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:8px;padding:16px 20px 20px;background:var(--cm-cream,#FDFBF7);border-bottom:2px solid var(--cm-black,#111)}
  .links.open{display:flex}
  .links>a{padding:13px 14px;font-size:1rem}
  .acct-m{display:flex;gap:10px;margin-top:6px;padding-top:16px;border-top:2px solid var(--cm-black,#111)}
  .acct-m .btn-v2{flex:1}
}

main{max-width:1100px;margin:auto;padding:32px 20px 80px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:600 1rem inherit;cursor:pointer;transition:.15s}
.btn:hover{background:var(--g2);transform:translateY(-1px)}.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}.btn.o:hover{background:var(--surf)}.btn.sm{padding:8px 14px;font-size:.9rem}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.2s}
a.card:hover,.card.h:hover{border-color:var(--g);box-shadow:0 6px 18px rgba(59, 130, 246,.15)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--surf);color:var(--mute)}.tag.g{background:var(--cm-yellow);color:var(--cm-black);border:1px solid var(--cm-black);}
.hero{padding:56px 0 48px;max-width:760px}.eyebrow{color:var(--g2);font-weight:800;letter-spacing:.14em;font-size:.85rem;margin-bottom:14px}.hero p{font-size:1.15rem}
.sec{margin-top:64px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.num{width:34px;height:34px;border-radius:50%;background:var(--gl);color:var(--g2);display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.grades{display:flex;gap:10px;flex-wrap:wrap}.gr{flex:1;min-width:90px;padding:16px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:700 1rem inherit;cursor:pointer;transition:.15s}.gr:hover{border-color:var(--g)}.gr.on{background:var(--g);border-color:var(--g);color:#fff}
.cta{background:var(--surf);border-radius:18px;padding:44px 24px;text-align:center}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:1px}
.form{max-width:420px;margin:30px auto}.fld{margin-bottom:16px}
.res{text-align:center;padding:30px 10px}.res small{letter-spacing:.14em;font-weight:800;color:var(--g2)}.res .big{font-size:clamp(3rem,10vw,4.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media(max-width:700px){.two{grid-template-columns:1fr}}
.six{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.chat{height:min(480px,60vh);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px}
.m{max-width:85%;padding:12px 15px;border-radius:14px;white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:4px}.m.a{background:var(--surf);color:var(--ink);border-bottom-left-radius:4px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 13px;border-radius:99px;font:.88rem inherit;cursor:pointer;transition:.15s}.chip:hover{border-color:var(--g);color:var(--g2)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--mute)}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}.stat span:last-child{color:var(--mute)}
.bar{height:8px;background:var(--surf);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.mute{opacity:.6}

/* =========================================================
   COURSEMAXXING V2 — PLAYFUL PROFESSIONAL HOMEPAGE
   ========================================================= */

body {
  background:var(--cm-cream);
  color:var(--cm-black);
  font-family:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

.hero-v2,
.intro-v2,
.bento-section,
.grade-v2,
.founder-v2,
.final-cta-v2 { color:var(--cm-black); }

.hero-v2 {
  min-height:620px;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:70px;
  align-items:center;
  padding:70px 0 90px;
}

.hero-copy { max-width:680px; }

.eyebrow-v2 {
  display:inline-block;
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
  color:var(--cm-black);
  margin-bottom:18px;
}

.hero-copy h1 {
  margin:0;
  font-size:clamp(42px,6vw,76px);
  line-height:.98;
  letter-spacing:-.055em;
  font-weight:900;
  max-width:720px;
}

.hero-copy h1 span,
.intro-v2 h2 span,
.founder-copy h2 span { color:var(--cm-blue); }

.hero-copy > p {
  max-width:590px;
  font-size:18px;
  line-height:1.65;
  margin:28px 0 30px;
}

.hero-actions {
  display:flex;
  align-items:center;
  gap:22px;
  flex-wrap:wrap;
}

.btn-v2 {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:15px 23px;
  border:2px solid var(--cm-black);
  border-radius:18px;
  font-weight:900;
  text-decoration:none;
  color:var(--cm-black);
  transition:.18s ease;
  box-shadow:5px 5px 0 var(--cm-black);
}

.btn-v2:hover {
  transform:translate(3px,3px);
  box-shadow:2px 2px 0 var(--cm-black);
}

.btn-v2.blue { background:var(--cm-blue); color:#fff; }
.btn-v2.black { background:var(--cm-black); color:white; }

.text-link-v2 {
  color:var(--cm-black);
  font-weight:800;
  text-decoration:underline;
  text-underline-offset:5px;
}

.hero-board {
  position:relative;
  min-height:470px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.student-card {
  position:relative;
  z-index:2;
  width:min(390px,90%);
  background:white;
  border:3px solid var(--cm-black);
  border-radius:30px;
  padding:30px;
  box-shadow:12px 12px 0 var(--cm-black);
  transform:rotate(2deg);
}

.board-tape {
  position:absolute;
  top:35px;
  right:85px;
  width:115px;
  height:34px;
  background:var(--cm-yellow);
  border:2px solid var(--cm-black);
  transform:rotate(8deg);
  z-index:3;
}

.student-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.mini-label {
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em;
}

.status-dot {
  font-size:10px;
  font-weight:900;
  color:#14833b;
}

.student-card h3 {
  font-size:42px;
  margin:20px 0 3px;
  font-weight:900;
  letter-spacing:-.04em;
}

.board-sub {
  margin:0 0 25px;
  color:#555;
}

.mini-stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:22px;
}

.mini-stats div {
  background:var(--cm-cream);
  border:2px solid var(--cm-black);
  border-radius:15px;
  padding:13px 8px;
  text-align:center;
}

.mini-stats strong {
  display:block;
  font-size:20px;
  font-weight:900;
}

.mini-stats span {
  display:block;
  font-size:10px;
  font-weight:800;
  margin-top:3px;
}

.plan-row {
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 0;
  border-top:2px solid #eee;
  font-size:13px;
  font-weight:700;
}

.plan-check {
  width:25px;
  height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--cm-black);
  border-radius:50%;
  background:var(--cm-blue);
  color:#fff;
  font-weight:900;
}

.plan-row.pending .plan-check { background:var(--cm-yellow); color:var(--cm-black); }

.floating-note {
  position:absolute;
  z-index:4;
  border:2px solid var(--cm-black);
  border-radius:18px;
  padding:14px 17px;
  font-weight:900;
  font-size:13px;
  box-shadow:5px 5px 0 var(--cm-black);
}

.floating-note span {
  margin-right:7px;
  font-size:18px;
}

.yellow-note {
  background:var(--cm-yellow);
  top:70px;
  left:0;
  transform:rotate(-7deg);
}

.coral-note {
  background:var(--cm-coral);
  bottom:55px;
  right:0;
  transform:rotate(6deg);
}

.intro-v2 {
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:80px;
  padding:110px 0;
  border-top:2px solid var(--cm-black);
}

.intro-v2 h2 {
  font-size:clamp(34px,4vw,52px);
  line-height:1.05;
  letter-spacing:-.045em;
  margin:0;
  font-weight:900;
}

.intro-v2 > p {
  font-size:19px;
  line-height:1.75;
  max-width:650px;
  margin:0;
}

.bento-section { padding:95px 0; }

.section-heading-v2 {
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:30px;
  margin-bottom:35px;
}

.section-heading-v2 h2 {
  font-size:clamp(34px,4vw,50px);
  line-height:1;
  letter-spacing:-.045em;
  margin:0;
  font-weight:900;
}

.section-heading-v2 > p {
  margin:0;
  font-weight:700;
  max-width:280px;
}

.bento-grid {
  display:grid;
  grid-template-columns:1.15fr .85fr .85fr;
  grid-template-rows:auto auto;
  gap:18px;
}

.bento-card {
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:270px;
  padding:28px;
  border:2px solid var(--cm-black);
  border-radius:28px;
  color:var(--cm-black);
  text-decoration:none;
  overflow:hidden;
  transition:.18s ease;
  box-shadow:7px 7px 0 var(--cm-black);
}

.bento-card:hover {
  transform:translate(3px,-4px);
  box-shadow:4px 11px 0 var(--cm-black);
}

.architect-card {
  grid-row:span 2;
  min-height:565px;
  background:var(--cm-blue);
  color:#fff;
}
.architect-card .card-arrow { color:#fff; }

.top6-card { background:var(--cm-yellow); }
.university-card { background:var(--cm-coral); color:#fff; }
.university-card .card-arrow { color:#fff; }
.course-card { background:white; }
.strategy-card { background:white; }
.portfolio-card { background:var(--cm-yellow); }

.bento-number {
  font-size:12px;
  font-weight:900;
  letter-spacing:.08em;
}

.bento-icon {
  width:75px;
  height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:30px 0 auto;
  border:3px solid var(--cm-black);
  border-radius:22px;
  background:white;
  color:var(--cm-black);
  font-size:40px;
  box-shadow:5px 5px 0 var(--cm-black);
}

.bento-content { margin-top:28px; }

.card-tag {
  display:inline-block;
  padding:6px 9px;
  border:2px solid var(--cm-black);
  border-radius:10px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.1em;
  margin-bottom:10px;
  color:var(--cm-black);
}

.blue-tag { background:#EFF6FF; }
.yellow-tag { background:#fff3ad; }
.coral-tag { background:#ffd0cb; }

.bento-content h3 {
  margin:0 0 8px;
  font-size:28px;
  line-height:1;
  letter-spacing:-.035em;
  font-weight:900;
}

.bento-content p {
  margin:0;
  max-width:430px;
  line-height:1.55;
  font-size:14px;
  font-weight:600;
}

.card-arrow {
  display:block;
  margin-top:22px;
  font-size:13px;
  font-weight:900;
  text-decoration:underline;
  text-underline-offset:4px;
}

.fake-chart {
  position:absolute;
  right:25px;
  bottom:25px;
  height:95px;
  display:flex;
  align-items:end;
  gap:7px;
}

.chart-bar {
  width:18px;
  border:2px solid var(--cm-black);
  border-bottom:0;
  background:white;
  border-radius:7px 7px 0 0;
}

.bar-one {height:35px;}
.bar-two {height:55px;}
.bar-three {height:48px;}
.bar-four {height:78px;}
.bar-five {height:65px;}

.grade-v2 {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center;
  padding:105px 0;
  border-top:2px solid var(--cm-black);
  border-bottom:2px solid var(--cm-black);
}

.grade-copy h2 {
  margin:0;
  font-size:clamp(36px,4vw,52px);
  line-height:1;
  letter-spacing:-.045em;
  font-weight:900;
}

.grade-copy p {
  font-size:17px;
  line-height:1.6;
  max-width:500px;
}

.grade-buttons-v2 {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.grade-pill {
  border:2px solid var(--cm-black);
  background:white;
  border-radius:20px;
  padding:18px 10px;
  cursor:pointer;
  color:var(--cm-black);
  box-shadow:4px 4px 0 var(--cm-black);
  transition:.16s ease;
}

.grade-pill:hover {
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 var(--cm-black);
}

.grade-pill span {
  display:block;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}

.grade-pill strong {
  display:block;
  font-size:27px;
  margin-top:2px;
}

.grade-pill.selected { background:var(--cm-blue); color:#fff; }

.founder-v2 {
  display:grid;
  grid-template-columns:.6fr 1.4fr;
  gap:80px;
  padding:110px 0;
}

.founder-star {
  width:75px;
  height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:30px;
  background:var(--cm-yellow);
  border:2px solid var(--cm-black);
  border-radius:50%;
  font-size:35px;
  box-shadow:6px 6px 0 var(--cm-black);
}

.founder-copy { max-width:760px; }

.founder-copy h2 {
  font-size:clamp(38px,5vw,62px);
  line-height:1;
  letter-spacing:-.05em;
  margin:0 0 30px;
  font-weight:900;
}

.founder-copy p {
  max-width:680px;
  font-size:17px;
  line-height:1.75;
}

.final-cta-v2 {
  position:relative;
  overflow:hidden;
  margin-bottom:20px;
  padding:90px 50px;
  background:var(--cm-blue);
  border:3px solid var(--cm-black);
  border-radius:35px;
  box-shadow:10px 10px 0 var(--cm-black);
}

.cta-sticker {
  display:inline-block;
  padding:8px 12px;
  background:var(--cm-yellow);
  border:2px solid var(--cm-black);
  border-radius:10px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.1em;
  transform:rotate(-2deg);
}

.final-cta-v2 h2 {
  margin:25px 0 12px;
  font-size:clamp(42px,6vw,72px);
  line-height:.98;
  letter-spacing:-.055em;
  font-weight:900;
}

.final-cta-v2 h2 span { color:white; }

.final-cta-v2 p {
  font-size:18px;
  font-weight:700;
  margin-bottom:28px;
}

@media(max-width:900px) {
  .hero-v2 {
    grid-template-columns:1fr;
    gap:45px;
  }

  .hero-board { min-height:440px; }

  .intro-v2,
  .grade-v2,
  .founder-v2 {
    grid-template-columns:1fr;
    gap:35px;
  }

  .bento-grid { grid-template-columns:1fr 1fr; }

  .architect-card { grid-row:span 2; }

  .section-heading-v2 { display:block; }

  .section-heading-v2 > p { margin-top:15px; }
}

@media(max-width:600px) {
  .hero-v2 { padding-top:45px; }

  .hero-copy h1 { font-size:43px; }

  .hero-copy > p { font-size:16px; }

  .hero-board { min-height:420px; }

  .student-card {
    width:85%;
    padding:23px;
  }

  .yellow-note {
    left:-5px;
    top:35px;
  }

  .coral-note {
    right:-5px;
    bottom:35px;
  }

  .intro-v2,
  .bento-section,
  .grade-v2,
  .founder-v2 {
    padding:75px 0;
  }

  .bento-grid { grid-template-columns:1fr; }

  .architect-card {
    grid-row:auto;
    min-height:390px;
  }

  .bento-card { min-height:250px; }

  .grade-buttons-v2 {
    grid-template-columns:repeat(2,1fr);
  }

  .final-cta-v2 {
    padding:60px 25px;
    border-radius:25px;
  }

  .final-cta-v2 h2 { font-size:44px; }
}

/* EXPLORE BUBBLES */
.bubble { 
  display: flex; align-items: center; justify-content: center; text-align: center;

function auditor(){let root=document.getElementById('audit');if(!root)return;let all=Object.entries(state.planner).flatMap(([g,a])=>a.map(x=>({...x,g:+g}))).filter(x=>x.code),m=[];if(+state.grade>=11&&!all.some(x=>x.code==='ENG4U'))m.push(['warn','ENG4U is not in your current plan. Check whether your target program requires Grade 12 English.']);if(+state.grade===11&&all.some(x=>x.g===12))m.push(['','Grade 12 courses may support early admission review if you meet the program’s requirements.']);if(state.programs.length)m.push(['',`You have ${state.programs.length} saved program(s). Check each program’s official prerequisites.`]);if(!m.length)m.push(['','No obvious planning alerts. This is not a complete prerequisite check.']);root.innerHTML=m.map(x=>`<div class="audit ${x[0]}">${esc(x[1])}</div>`).join('')}
function explore(){return `${head('EXPLORE YOUR OPTIONS','Meet Ingeniosus AI.','A guided starting point for exploring interests and Ontario university pathways. Recommendations are illustrative until verified against official program pages.')}<div class="notice blue"><b>Ingeniosus AI is a demo.</b> It does not connect to a live AI model yet. It uses your choices to create a starter shortlist, not verified admissions advice.</div><div class="crumbs">${[1,2,3].map(n=>`<button data-step="${n}">${n===1?'1 · Interest':n===2?'2 · Priorities':'3 · Results'}</button>${n<3?' / ':''}`).join('')}</div><div id="scout">${scout(state.interests.step||1)}</div>`}
function scout(step){let s=state.interests;if(step===1){let a=[['Business','blue','Finance, management, accounting and marketing'],['Science','yellow','Life sciences, physical sciences and health'],['Arts','coral','Humanities, social sciences and creative fields'],['Other','white','Technology, trades and interdisciplinary paths'],['Not Sure','yellow','Explore before choosing a direction']];return `<h2>What are you curious about?</h2><p>Choose the closest fit. You can change it later.</p><div class="bubbles">${a.map(x=>`<button class="bubble ${x[1]}" data-area="${x[0]}"><strong>${x[0]}</strong><small>${x[2]}</small></button>`).join('')}</div>`}if(step===2)return `<h2>What matters most to you?</h2><p>Pick your priorities and name a career or subject if you have one in mind.</p><div class="card"><div class="fields"><div class="field"><label for="career">Career or subject goal</label><input id="career" value="${esc(s.career)}" placeholder="e.g. finance, psychology, biology"></div><div class="field"><label for="deal">Biggest priority</label><select id="deal">${['Co-op','Cost','Distance','Admissions requirements','Campus life','Not sure'].map(x=>`<option ${s.dealbreaker===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="distance">Preferred distance</label><select id="distance">${['Any distance','Close to home','Within Ontario','Willing to move'].map(x=>`<option ${s.distance===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="budget">Budget preference</label><select id="budget">${['Any budget','Lower cost','Need scholarships','Compare costs'].map(x=>`<option ${s.budget===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="row" style="margin-top:15px"><button class="btn white" data-step="1">← Back</button><button class="btn blue" id="generate">Build my starter shortlist →</button></div></div>`;let opts=options(s.area,s.career);return `<h2>Your starter shortlist</h2><p>Based on <span class="pill">${esc(s.area||'Not Sure')}</span> and your priorities. These are starting points, not ranked matches.</p><div class="grid g2">${opts.map((o,i)=>`<article class="card ${i%3===0?'blue':i%3===1?'yellow':'coral'}"><div class="eyebrow">STARTER OPTION ${i+1}</div><h3>${o.name}</h3><p>${o.why}</p><p><b>Research next:</b> admission prerequisites, co-op, costs, distance and scholarships on the official site.</p><div class="row"><a class="btn white" target="_blank" rel="noopener" href="${o.url}">Official website ↗</a><button class="btn white" data-save-program="${o.name}">Save to Portfolio</button></div></article>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn white" data-step="2">← Change priorities</button><button class="btn coral" data-step="1">Start over</button><a class="btn blue" href="#/portfolio">View portfolio →</a></div>`}
function options(area,career){let c=(career||'').toLowerCase();if(area==='Business'||/finance|account|business|econom|marketing/.test(c))return [{name:'University of Toronto',why:'Research Rotman Commerce and related undergraduate options; verify the route and requirements.',url:'https://www.utoronto.ca/'},{name:'Western University',why:'Research Ivey AEO and other business/economics pathways.',url:'https://www.uwo.ca/'},{name:'Wilfrid Laurier University',why:'Research business and economics programs and co-op options.',url:'https://www.wlu.ca/'}];if(area==='Science'||/biology|chem|physics|health|science/.test(c))return [{name:'University of Waterloo',why:'Research science programs, prerequisites and co-op availability.',url:'https://uwaterloo.ca/'},{name:'McMaster University',why:'Research life science and other science pathways.',url:'https://www.mcmaster.ca/'},{name:'University of Toronto',why:'Compare science programs and campus options.',url:'https://www.utoronto.ca/'}];if(area==='Arts'||/psych|law|history|english|sociology|politic/.test(c))return [{name:'York University',why:'Research humanities, social science and psychology options.',url:'https://www.yorku.ca/'},{name:'University of Toronto',why:'Explore humanities and social science programs.',url:'https://www.utoronto.ca/'},{name:'Queen’s University',why:'Research arts and social science programs.',url:'https://www.queensu.ca/'}];return [{name:'Ontario Universities’ Info',why:'Compare university programs across Ontario.',url:'https://www.ontariouniversitiesinfo.ca/'},{name:'Ontario Colleges',why:'Compare college certificates, diplomas and degrees.',url:'https://www.ontariocolleges.ca/'},{name:'OUAC',why:'Learn how Ontario university applications work.',url:'https://www.ouac.on.ca/'}]}
function portfolio(){return `${head('YOUR EXECUTION HUB','Keep the good stuff.','Save your goals, programs, experiences and deadlines. Data is saved locally in this browser.')}<div class="grid g2"><article class="card yellow"><h2>My targets & interests</h2><div class="field"><label for="targetCareer">Career / interest goal</label><input id="targetCareer" value="${esc(state.targets.career||state.interests.career)}" placeholder="What are you exploring?"></div><div class="field" style="margin-top:10px"><label for="targetAvg">Target average (%)</label><input id="targetAvg" type="number" min="0" max="100" value="${+state.targets.average||90}"></div><button class="btn white" id="saveTargets" style="margin-top:12px">Save targets</button><hr class="divider"><h3>Saved programs</h3>${state.programs.length?state.programs.map((p,i)=>`<div class="listitem"><div><b>${esc(p.name)}</b><p>${esc(p.area||'Pathway')} · Verify prerequisites and supplemental details.</p></div><button class="btn small white" data-rprog="${i}">Remove</button></div>`).join(''):'<div class="empty">No saved programs yet. Visit Explore.</div>'}</article><article class="card coral"><h2>Deadline board</h2><p>Enter dates manually. The system does not auto-track university deadlines.</p><div class="field"><label for="dname">Deadline name</label><input id="dname" placeholder="e.g. Scholarship application"></div><div class="field" style="margin-top:10px"><label for="ddate">Date</label><input id="ddate" type="date"></div><button class="btn white" id="addDeadline" style="margin-top:12px">+ Add deadline</button><div class="stack" style="margin-top:14px">${state.deadlines.length?state.deadlines.map((d,i)=>`<div class="listitem"><div><b>${esc(d.name)}</b><p>${esc(d.date)} · ${days(d.date)}</p></div><button class="btn small white" data-rdead="${i}">Remove</button></div>`).join(''):'<div class="empty">Your deadline list is empty.</div>'}</div></article></div><section class="section"><article class="card"><div class="eyebrow">BRAG SHEET</div><h2>Experiences & achievements</h2><p>Record volunteering, clubs, sports, jobs, awards and projects before you need them for applications.</p><div class="fields"><div class="field"><label for="expname">Experience / achievement</label><input id="expname" placeholder="e.g. School soccer team"></div><div class="field"><label for="exptype">Category</label><select id="exptype">${['Volunteering','Club','Sport','Job','Award','Project','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field" style="margin-top:10px"><label for="expnotes">What did you do or learn?</label><textarea id="expnotes" placeholder="Role, dates, responsibilities, impact…"></textarea></div><button class="btn blue" id="addExp" style="margin-top:10px">Add experience</button><div class="grid g2" style="margin-top:15px">${state.experiences.map((e,i)=>`<div class="listitem"><div><b>${esc(e.name)}</b><p><span class="pill">${esc(e.type)}</span></p><p>${esc(e.notes)}</p></div><button class="btn small white" data-rexp="${i}">Remove</button></div>`).join('')||'<div class="empty">No experiences saved yet.</div>'}</div></article></section>`}
function studytips(){let starter=+state.grade<=9;let list=starter?[['planner','Use a weekly planner for due dates.'],['notes','Turn notes into questions and answers.'],['practice','Practise questions before rereading.'],['ask','Ask for help before you are completely stuck.']]:[['recall','Active recall: close notes and retrieve the idea from memory.'],['spacing','Spaced repetition: revisit content across several days.'],['practice','Use practice questions and learn from mistakes.'],['rest','Protect sleep and plan breaks to reduce burnout.']];return `${head('STUDY TIPS & RESOURCES',starter?'Start strong. Keep it simple.':'Study smarter, not just longer.','Practical techniques to try today. Save the ones you want to come back to.')}<div class="grid g2"><article class="card yellow"><div class="eyebrow">${starter?'GRADES 8–9':'GRADES 11–12'}</div><h2>${starter?'High school survival kit':'University prep toolkit'}</h2><div class="stack">${list.map(x=>`<label class="checkline"><input type="checkbox" data-tip="${x[0]}" ${state.tipsDone[x[0]]?'checked':''}>${x[1]}</label>`).join('')}</div></article><article class="card blue"><h2>Math & science lifesavers</h2><p style="color:white">External resources open in a new tab. Check they match your course and teacher’s expectations.</p><div class="stack"><a class="resource" href="https://www.jensenmath.ca/" target="_blank" rel="noopener">Jensen Math ↗</a><a class="resource" href="https://www.youtube.com/@TheOrganicChemistryTutor" target="_blank" rel="noopener">The Organic Chemistry Tutor ↗</a><a class="resource" href="https://www.khanacademy.org/" target="_blank" rel="noopener">Khan Academy ↗</a></div></article></div><div class="notice">Study techniques work best with consistent practice, asking questions and enough rest.</div>`}

xxing data saved in this browser?')){localStorage.removeItem(KEY);state=blank();location.hash='#/';render()}}}
function readGrade(){state.marks=[...document.querySelectorAll('[data-n]')].map((x,i)=>({name:x.value,weight:document.querySelector(`[data-w="${i}"]`).value,grade:document.querySelector(`[data-g="${i}"]`).value}));save()}function calcGrade(){readGrade();let rows=state.marks.filter(x=>x.weight!==''&&x.grade!==''&&+x.weight>=0&&+x.grade>=0&&+x.grade<=100),w=rows.reduce((a,x)=>a+(+x.weight),0),points=rows.reduce((a,x)=>a+(+x.weight)*(+x.grade),0),out=document.getElementById('gradeResult');if(!rows.length||w<=0){out.innerHTML='<div class="notice coral">Enter at least one component with a positive total weight and a valid grade.</div>';return}let avg=points/w,remaining=100-w;out.innerHTML=`<div class="result"><small>Weighted average of entered components</small><div class="big">${avg.toFixed(2)}%</div><p>${w.toFixed(1)}% of course weight entered. ${remaining>0?remaining.toFixed(1)+'% not represented yet.':w>100?'Weights exceed 100%; check your inputs.':'Weights total 100%.'}</p>${remaining>0&&w<100?'<label for="targetFinal">Desired final grade (%)</label><input id="targetFinal" type="number" min="0" max="100" placeholder="e.g. 85"><button class="btn blue" id="required" style="margin-top:8px">What do I need?</button><p id="requiredOut"></p>':''}</div>`;let btn=document.getElementById('required');if(btn)btn.onclick=()=>{let t=+document.getElementById('targetFinal').value,need=(t*100-points)/remaining,o=document.getElementById('requiredOut');o.textContent=!Number.isFinite(t)||t<0||t>100?'Enter a target from 0 to 100.':need>100?`You would need ${need.toFixed(1)}% on the remaining work, above 100%.`:`You need about ${need.toFixed(1)}% average on the remaining ${remaining.toFixed(1)}% of the course.`}}
function updateAvg(){let a=avg6(),o=document.getElementById('avgResult'),m=document.getElementById('avgMessage'),t=+(document.getElementById('target')?.value??state.targets.average??90);if(o)o.textContent=a===null?'—':a.toFixed(1)+'%';if(m)m.textContent=a===null?'Enter marks for courses you want to include.':a>=t?`At or above your ${t}% target based on entered marks.`:`${(t-a).toFixed(1)} percentage points below your ${t}% target based on entered marks.`}function flash(el,t){let b=typeof el==='string'?document.getElementById(el):el,old=b.textContent;b.textContent=t;setTimeout(()=>{if(b.isConnected)b.textContent=old},1300)}
